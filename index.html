<title>Cup of Culture</title>

<style>
  :root{
    --red:#E5231B;--red-text:#FF4A3F;
    --bg:#0B0B0C;--surf:#141416;--line:#26262B;--line-strong:#62626A;
    --ink:#FAFAFA;--soft:#C3C3C8;--muted:#86868E;
    --disp:"Arial Narrow","Helvetica Neue","Roboto Condensed",Arial,sans-serif;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){--bg:#FFFFFF;--surf:#FAFAF8;--line:#E7E5DF;--line-strong:#8A877F;--ink:#0B0B0C;--soft:#3A3A3D;--muted:#6B6970;--red-text:#CC1F18;color-scheme:light}
  }
  :root[data-theme="light"]{--bg:#FFFFFF;--surf:#FAFAF8;--line:#E7E5DF;--line-strong:#8A877F;--ink:#0B0B0C;--soft:#3A3A3D;--muted:#6B6970;--red-text:#CC1F18;color-scheme:light}
  :root[data-theme="dark"]{--bg:#0B0B0C;--surf:#141416;--line:#26262B;--line-strong:#62626A;--ink:#FAFAFA;--soft:#C3C3C8;--muted:#86868E;--red-text:#FF4A3F;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--soft);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px;width:100%}
  .mast{border-bottom:1px solid var(--ink)}
  .mast .top{display:flex;align-items:center;padding:26px 0 20px}
  .wordmark{font-family:var(--disp);font-weight:800;font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:.02em;line-height:1;color:var(--ink);text-transform:uppercase;display:flex;align-items:center;gap:14px}
  .wordmark svg{width:44px;height:44px;flex:0 0 auto;color:var(--ink)}
  main{flex:1;display:flex;align-items:center}
  .body{max-width:720px;padding-top:72px;padding-bottom:96px}
  h1{font-family:var(--disp);font-weight:800;text-transform:uppercase;color:var(--ink);font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:.98;letter-spacing:0;margin:0 0 22px;text-wrap:balance}
  .deck{font-family:var(--serif);font-size:1.28rem;line-height:1.5;color:var(--soft);margin:0}
  .soc{margin-top:48px}
  .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red-text);margin:0 0 14px;line-height:1.6}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
  li{border-bottom:1px solid var(--line)}
  li a{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 2px;color:var(--ink);font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:1.05rem;letter-spacing:.03em;transition:color .18s ease}
  li a svg{width:18px;height:18px;fill:currentColor;flex:0 0 auto;color:var(--soft);transition:color .18s ease}
  li a .h{margin-left:auto;font-family:var(--mono);font-weight:400;font-size:.72rem;letter-spacing:.05em;text-transform:none;color:var(--muted)}
  li a:hover,li a:hover svg{color:var(--red-text)}
  a:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:2px}
  @media (max-width:560px){
    .mast .top{padding:20px 0 16px}
    .wordmark{gap:10px}
    .wordmark svg{width:36px;height:36px}
    .body{padding-top:44px;padding-bottom:64px}
    .deck{font-size:1.15rem}
    .soc{margin-top:38px}
  }
</style>
</head>

</div></header>
